name: Rust

# Fast gate for every push and pull request: formatting, clippy, and the unit
# tests, all on a single Linux runner. Nothing here produces binaries; the
# cross-platform release builds live in release.yml and only run when a release
# is published.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: clippy (no clipboard)
        run: cargo clippy --all-targets --locked --no-default-features -- -D warnings

      - name: Run tests
        run: cargo test --locked
