[package]
name = "spark"
version = "2.0.1"
edition = "2021"
repository = "https://github.com/pwnxpl0it/spark"
authors = ["Mohamed Tarek @pwnxpl0it"]
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name="spark"
path="src/core/lib.rs"

[[bin]]
name="spark"
path="src/cli/main.rs"

[dependencies]
chrono = "0.4.34"
clap = { version = "4", features = ["derive"] }
colored = "2.0.0"
dotenvy = "0.15"
indexmap = "2.2.6"
jaq-interpret = "1.5"
jaq-parse = "1.0"
liquid = "0.26.9"
promptly = "0.3.1"
regex = "1.7.1"
serde = { version = "1.0.152", features = ["serde_derive"] }
serde_json = "1.0.117"
shellexpand = "3.1.0"
toml = "0.8"
ignore = "0.4"
arboard = { version = "3.4", features = ["wayland-data-control"], optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["clipboard"]
# `clipboard://` output target. Disable with `--no-default-features` to build
# without X11/Wayland libraries; the target then returns an error at write time.
clipboard = ["dep:arboard"]
